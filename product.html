<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090c0e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Michroma&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/data.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/product.js"></script>
  <title>Volt Runner X1 — VOLT</title>
  <meta name="description" content="Ultra-light. Maximum response. Next gen cushioning and all-day comfort.">
</head>
<body data-page="product">
  <main class="container pdp">
    <div class="pdp__bar">
      <a href="shop.html" class="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12H5m6-6-6 6 6 6"/></svg>Back to Shop</a>
      <nav class="crumbs" aria-label="Breadcrumb"></nav>
    </div>

    <div class="pdp__main">
      <div class="thumbs" role="tablist" aria-label="Product images"></div>

      <div class="viewer" data-drag>
        <div class="viewer__glow"></div>
        <div class="viewer__stage"></div>
        <span class="viewer__zoom" data-frame>01 / 05</span>
        <div class="viewer__hint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M9 11V4.5a1.5 1.5 0 0 1 3 0V10m0-.5V3.5a1.5 1.5 0 0 1 3 0V10m0-4a1.5 1.5 0 0 1 3 0v8c0 4-2.5 7-6.5 7S6 19 4.8 16.4L3.4 13a1.5 1.5 0 0 1 2.6-1.5L9 15"/></svg>
          <div class="viewer__nav">
            <button data-step="-1" aria-label="Previous image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m15 6-6 6 6 6"/></svg></button>
            <span>Drag to rotate</span>
            <button data-step="1" aria-label="Next image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m9 6 6 6-6 6"/></svg></button>
          </div>
        </div>
      </div>

      <section class="buybox" data-reveal="right"></section>
    </div>

    <section class="features" id="tech">
      <article class="feature" data-reveal style="--d:0s">
        <div class="feature__img"><img src="assets/img/tech-cushion.webp" alt="Cushion lattice close-up" loading="lazy"></div>
        <div><h3>Cushion lattice</h3><p>Next-gen foam for energy return.</p></div>
      </article>
      <article class="feature" data-reveal style="--d:.1s">
        <div class="feature__img"><img src="assets/img/tech-carbon.webp" alt="Carbon plate close-up" loading="lazy"></div>
        <div><h3>Carbon plate</h3><p>Explosive propulsion with every stride.</p></div>
      </article>
      <article class="feature" data-reveal style="--d:.2s">
        <div class="feature__img"><img src="assets/img/tech-grip.webp" alt="Grip outsole close-up" loading="lazy"></div>
        <div><h3>Grip technology</h3><p>All-surface traction for total control.</p></div>
      </article>
    </section>

    <section class="related">
      <div class="section-head">
        <div>
          <p class="mono" data-reveal>// Complete the rotation</p>
          <h2 class="section-title" data-split>You might <span class="mint">also like.</span></h2>
        </div>
      </div>
      <div class="grid" data-related></div>
    </section>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>
